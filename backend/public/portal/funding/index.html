<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WE DONATE — Financial Support & Donation Campaigns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F8FAFC; font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero-banner { background: linear-gradient(135deg, #0F172A 0%, #E11D48 100%); color: white; padding: 60px 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
    .campaign-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    .progress-bar-custom { background-color: #E11D48; }
  </style>
</head>
<body>
  <!-- Hero Banner -->
  <div class="hero-banner text-center mb-5">
    <div class="container max-w-lg">
      <h1 class="fw-extrabold display-5 mb-3">🩸 Support WE DONATE Mission</h1>
      <p class="lead opacity-90 mb-4">Help us fund refrigerated blood transport vehicles, free mobile blood donation camps in rural villages, and emergency medical equipment.</p>
      <a href="#campaigns" class="btn btn-light btn-lg fw-bold text-danger px-4 rounded-pill shadow">View Active Campaigns ↓</a>
    </div>
  </div>

  <div class="container mb-5" id="campaigns">
    <h3 class="fw-bold mb-4 text-center">Active Financial Campaigns</h3>
    <div class="row g-4 justify-content-center" id="campaignsGrid">
      <div class="text-center text-muted">Loading active campaigns...</div>
    </div>
  </div>

  <!-- Contribution Modal -->
  <div class="modal fade" id="donateModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Make a Financial Contribution</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalCampaignId">
          <div class="mb-3"><label class="form-label">Full Name</label><input type="text" id="dName" class="form-control" placeholder="Ayush Sharma"></div>
          <div class="mb-3"><label class="form-label">Email Address</label><input type="email" id="dEmail" class="form-control" placeholder="ayush@example.com"></div>
          <div class="mb-3"><label class="form-label">Phone Number</label><input type="text" id="dPhone" class="form-control" placeholder="+919876543210"></div>
          <div class="mb-3">
            <label class="form-label">Contribution Amount (INR)</label>
            <div class="d-flex gap-2 mb-2">
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="setAmt(500)">₹500</button>
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="setAmt(1000)">₹1,000</button>
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="setAmt(2500)">₹2,500</button>
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="setAmt(5000)">₹5,000</button>
            </div>
            <input type="number" id="dAmount" class="form-control" value="1000">
          </div>
          <button class="btn btn-danger w-100 fw-bold py-2" onclick="submitDonation()">Proceed to Contribute & Issue Receipt</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadCampaigns() {
      try {
        const res = await fetch('/api/v1/funding/campaigns');
        const data = await res.json();
        const grid = document.getElementById('campaignsGrid');
        grid.innerHTML = '';
        if (data.success && data.data.campaigns.length > 0) {
          data.data.campaigns.forEach(c => {
            const pct = Math.min(100, Math.round((c.amountRaised / c.targetAmount) * 100));
            grid.innerHTML += `
              <div class="col-md-6 col-lg-5">
                <div class="card campaign-card p-4 h-100 bg-white">
                  <h4 class="fw-bold text-dark mb-2">${c.title}</h4>
                  <p class="text-muted mb-3">${c.description}</p>
                  
                  <div class="d-flex justify-content-between small fw-bold mb-1">
                    <span>Raised: ₹${c.amountRaised.toLocaleString()}</span>
                    <span>Target: ₹${c.targetAmount.toLocaleString()} (${pct}%)</span>
                  </div>
                  <div class="progress mb-4" style="height: 10px;">
                    <div class="progress-bar progress-bar-custom" style="width: ${pct}%"></div>
                  </div>

                  <button class="btn btn-danger w-100 fw-bold mt-auto py-2" onclick="openDonateModal('${c._id}')">Contribute Now 💳</button>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function openDonateModal(cId) {
      document.getElementById('modalCampaignId').value = cId;
      new bootstrap.Modal(document.getElementById('donateModal')).show();
    }

    function setAmt(val) {
      document.getElementById('dAmount').value = val;
    }

    async function submitDonation() {
      const campaignId = document.getElementById('modalCampaignId').value;
      const donorName = document.getElementById('dName').value;
      const donorEmail = document.getElementById('dEmail').value;
      const donorPhone = document.getElementById('dPhone').value;
      const amount = document.getElementById('dAmount').value;

      try {
        const res = await fetch('/api/v1/funding/donate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ campaignId, donorName, donorEmail, donorPhone, amount })
        });
        const data = await res.json();
        if (data.success) {
          const d = data.data.donation;
          alert(`Contribution Successful!\nReceipt No: ${d.receiptNumber}\nTransaction ID: ${d.transactionId}`);
          location.reload();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    loadCampaigns();
  </script>
</body>
</html>
