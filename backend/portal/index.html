<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WE DONATE — Multi-Portal Login Hub</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #F8FAFC;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .login-card {
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
    }
  </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    <div id="liveToast" class="toast align-items-center text-white bg-dark border-0 shadow-lg" role="alert">
      <div class="d-flex">
        <div class="toast-body fw-bold" id="toastMessage">Alert</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-lg login-card p-4">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2" style="width: 64px; height: 64px;">
        <i class="bi bi-droplet-fill fs-1"></i>
      </div>
      <h3 class="fw-extrabold text-dark mb-1">WE DONATE</h3>
      <p class="text-muted small mb-0">Unified Operations & Management Control Hub</p>
      <div class="mt-2">
        <span class="badge bg-light text-secondary border px-2 py-1 small">Role-Based Authentication Router</span>
      </div>
    </div>

    <form id="portalLoginForm" onsubmit="handlePortalLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-bold small text-secondary">Official Email / Login ID / Mobile</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
          <input type="text" id="loginEmail" class="form-control" placeholder="admin@wedonate.org or hospital@aiims.org" value="admin@wedonate.org" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold small text-secondary">Portal Password / Access Key</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-shield-lock"></i></span>
          <input type="password" id="loginPassword" class="form-control" value="DevPassword123!" required>
        </div>
      </div>
      <button type="submit" id="btnLogin" class="btn btn-danger w-100 fw-bold py-2 shadow-sm mb-3">
        <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
        Authenticate & Launch Portal
      </button>
    </form>

    <div class="border-top pt-3 text-center">
      <small class="text-muted d-block mb-2">Direct Portal Quick Links:</small>
      <div class="d-flex justify-content-center gap-2">
        <a href="/portal/admin" class="btn btn-outline-danger btn-sm fw-bold">Admin Portal</a>
        <a href="/portal/hospital" class="btn btn-outline-primary btn-sm fw-bold">Hospital Portal</a>
        <a href="/portal/blood-bank" class="btn btn-outline-secondary btn-sm fw-bold">Blood Bank Portal</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/v1';

    function showToast(msg, isError = false) {
      const toastEl = document.getElementById('liveToast');
      document.getElementById('toastMessage').innerText = msg;
      toastEl.className = `toast align-items-center text-white border-0 shadow-lg ${isError ? 'bg-danger' : 'bg-dark'}`;
      new bootstrap.Toast(toastEl).show();
    }

    async function handlePortalLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('loginSpinner');

      btn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        let res;
        let isOrgLogin = false;
        try {
          const resp = await fetch(`${API_BASE}/auth/admin-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.message || 'Admin login failed');
          res = data;
        } catch (adminErr) {
          const resp = await fetch(`${API_BASE}/organizations/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, loginId: email, password })
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.message || 'Organization login failed');
          res = data;
          isOrgLogin = true;
        }

        const token = res.data.tokens.accessToken;
        localStorage.setItem('wedonate_access_token', token);
        const user = res.data.user || {};
        const role = user.role || (res.data.organization ? res.data.organization.type : '');

        showToast('Authentication successful. Redirecting to your portal...');

        setTimeout(() => {
          routeUserByRole(role, res.data.organization);
        }, 500);

      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    }

    function routeUserByRole(role, org) {
      const r = (role || '').toUpperCase();
      const orgType = org ? org.type : '';

      if (r === 'SUPER_ADMIN' || r === 'ADMIN') {
        window.location.href = '/portal/admin';
      } else if (r === 'HOSPITAL' || r === 'HOSPITAL_MANAGER' || orgType === 'HOSPITAL') {
        window.location.href = '/portal/hospital';
      } else if (r === 'BLOOD_BANK' || r === 'BLOOD_BANK_MANAGER' || orgType === 'BLOOD_BANK') {
        window.location.href = '/portal/blood-bank';
      } else {
        window.location.href = '/portal/admin';
      }
    }

    // Auto-check if logged in
    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('wedonate_access_token');
      if (token) {
        try {
          const resp = await fetch(`${API_BASE}/organizations/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await resp.json();
          if (resp.ok && data.data && data.data.organization) {
            routeUserByRole(data.data.role, data.data.organization);
            return;
          }
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
